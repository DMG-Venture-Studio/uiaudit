# The planted violations for the Python side: one per rule that matters, each with the check that must
# refuse it and words its refusal must contain. Run from the repository root:
#   uv run python tools/toolkit/prove_checks.py plants.toml
# Every check added later gets its plant here before anything relies on it.

[[check]]
name = "contracts"
prepare = [["uv", "run", "python", "tools/toolkit/render_import_contracts.py", "--check", "project-spec.toml", "contracts.toml", "src/uiaudit"]]
run = ["uv", "run", "lint-imports", "--config", "contracts.toml", "--no-cache"]
env = { PYTHONPATH = "src" }

[[check]]
name = "ruff"
run = ["uv", "run", "ruff", "check", "."]

[[check]]
name = "format"
run = ["uv", "run", "ruff", "format", "--check", "."]

[[check]]
name = "types"
run = ["uv", "run", "pyrefly", "check"]

[[check]]
name = "deps"
run = ["uv", "run", "deptry", "src"]

[[check]]
name = "harness"
run = ["uv", "run", "python", "tools/toolkit/harness_audit.py", "--gate"]

[[check]]
name = "tests"
run = ["uv", "run", "pytest", "-q"]

[[check]]
name = "one-home"
run = ["uv", "run", "python", "tools/one_home.py"]

[[check]]
name = "ways-in"
run = ["uv", "run", "python", "tools/ways_in.py"]

[[check]]
name = "ratchet"
run = ["uv", "run", "python", "tools/ratchet.py"]

[[check]]
name = "rules-render"
run = ["uv", "run", "python", "tools/render_rules.py", "--check"]

[[check]]
name = "mcp-legibility"
run = ["uv", "run", "python", "tools/mcp_legibility.py"]

[[check]]
name = "review"
run = ["uv", "run", "python", "tools/review_check.py", "--base", "HEAD"]

[[check]]
name = "surfaces-render"
run = ["uv", "run", "python", "tools/render_surfaces.py", "--check"]

[[check]]
name = "surface-parity"
run = ["uv", "run", "pytest", "-q", "tests/test_surface_parity.py"]

